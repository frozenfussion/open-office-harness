# SPDX-License-Identifier: AGPL-3.0-only
[project]
name = "ooh-slides-worker"
version = "0.3.0"
requires-python = "==3.14.10"
dependencies = [
  "fastapi==0.162.2", "uvicorn==0.54.0", "pydantic==2.14.3",
  "httpx==0.28.1", "confluent-kafka==2.16.1", "jsonschema==4.26.0", "referencing==0.37.0",
  "python-pptx==1.0.2", "lxml==6.1.3", "Pillow==13.0.0",
  "XlsxWriter==3.3.1", "typing-extensions==4.16.0",
]
[dependency-groups]
dev = ["pytest==9.2.0", "respx==0.23.1", "ruff==0.17.4"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
