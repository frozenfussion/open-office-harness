apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: ${PLATFORM_NAMESPACE}
  labels:
    strimzi.io/cluster: ooh-kafka
spec:
  replicas: 1
  roles:
  - controller
  - broker
  storage:
    type: jbod
    volumes:
    - id: 0
      type: persistent-claim
      size: ${KAFKA_STORAGE}
      class: ${STORAGE_CLASS}
      deleteClaim: false
      kraftMetadata: shared
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: ooh-kafka
  namespace: ${PLATFORM_NAMESPACE}
spec:
  kafka:
    version: 4.3.2
    metadataVersion: 4.3-IV0
    listeners:
    - name: internal
      port: 9092
      type: internal
      tls: false
      authentication:
        type: scram-sha-512
    authorization:
      type: simple
    config:
      auto.create.topics.enable: false
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    userOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
