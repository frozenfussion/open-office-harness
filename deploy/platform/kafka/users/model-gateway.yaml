apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: model-gateway
  namespace: ${PLATFORM_NAMESPACE}
  labels:
    strimzi.io/cluster: ooh-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: audit.events
        patternType: literal
      operations:
      - Write
      - Describe
