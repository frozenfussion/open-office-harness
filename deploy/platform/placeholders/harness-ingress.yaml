apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harness
  namespace: ${APPS_NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - harness.${DOMAIN}
    secretName: harness-tls
  rules:
  - host: harness.${DOMAIN}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: harness-api
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: workspace
            port:
              number: 8080
