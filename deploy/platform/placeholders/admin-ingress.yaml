apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: ${APPS_NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - admin.${DOMAIN}
    secretName: admin-tls
  rules:
  - host: admin.${DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-console
            port:
              number: 8080
