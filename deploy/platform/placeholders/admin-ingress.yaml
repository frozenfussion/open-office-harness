apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: ooh-apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - admin.faysalaziz.com
    secretName: admin-tls
  rules:
  - host: admin.faysalaziz.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: control-centre-api
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-console
            port:
              number: 8080
