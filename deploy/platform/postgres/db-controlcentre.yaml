apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: controlcentre
  namespace: ooh-platform
spec:
  cluster:
    name: ooh-pg
  name: controlcentre
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  passwordSecret:
    name: controlcentre-db
  databaseRoleReclaimPolicy: retain
---
