apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ooh-pg
  namespace: ooh-platform
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 20Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-db
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
