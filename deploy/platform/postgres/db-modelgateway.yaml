apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: modelgateway
  namespace: ${PLATFORM_NAMESPACE}
spec:
  cluster:
    name: ooh-pg
  name: modelgateway
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  passwordSecret:
    name: modelgateway-db
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: modelgateway-app
  namespace: ${PLATFORM_NAMESPACE}
spec:
  cluster:
    name: ooh-pg
  name: modelgateway_app
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  passwordSecret:
    name: modelgateway-app-db
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: modelgateway-test
  namespace: ${PLATFORM_NAMESPACE}
spec:
  cluster:
    name: ooh-pg
  name: modelgateway_test
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  passwordSecret:
    name: modelgateway-test-db
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: modelgateway-test-app
  namespace: ${PLATFORM_NAMESPACE}
spec:
  cluster:
    name: ooh-pg
  name: modelgateway_test_app
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  passwordSecret:
    name: modelgateway-test-app-db
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: modelgateway
  namespace: ${PLATFORM_NAMESPACE}
spec:
  cluster:
    name: ooh-pg
  name: modelgateway
  owner: modelgateway
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: modelgateway-test
  namespace: ${PLATFORM_NAMESPACE}
spec:
  cluster:
    name: ooh-pg
  name: modelgateway_test
  owner: modelgateway_test
  databaseReclaimPolicy: retain
