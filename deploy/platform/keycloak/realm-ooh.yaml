# SPDX-License-Identifier: AGPL-3.0-only
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: ooh
  namespace: ${PLATFORM_NAMESPACE}
spec:
  keycloakCRName: ooh-keycloak
  realm:
    realm: ooh
    enabled: true
    registrationAllowed: true
    registrationEmailAsUsername: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    editUsernameAllowed: false
    verifyEmail: false
    resetPasswordAllowed: false
    internationalizationEnabled: true
    supportedLocales: [en]
    defaultLocale: en
    passwordPolicy: length(12) and notUsername and notEmail and maxLength(128)
    localizationTexts:
      en:
        noAccount: Need access?
        doRegister: Request access
        registerTitle: Request access
    bruteForceProtected: true
    accessTokenLifespan: 300
    components:
      org.keycloak.userprofile.UserProfileProvider:
      - providerId: declarative-user-profile
        config:
          kc.user.profile.config:
          - |
            {
              "attributes": [
                {
                  "name": "username",
                  "displayName": "${username}",
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  },
                  "validations": {
                    "length": {
                      "min": 3,
                      "max": 255
                    },
                    "username-prohibited-characters": {},
                    "up-username-not-idn-homograph": {}
                  }
                },
                {
                  "name": "email",
                  "displayName": "${email}",
                  "required": {
                    "roles": [
                      "user"
                    ]
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  },
                  "validations": {
                    "email": {},
                    "length": {
                      "max": 255
                    }
                  }
                },
                {
                  "name": "firstName",
                  "displayName": "${firstName}",
                  "required": {
                    "roles": [
                      "user"
                    ]
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  },
                  "validations": {
                    "length": {
                      "max": 255
                    },
                    "person-name-prohibited-characters": {}
                  }
                },
                {
                  "name": "lastName",
                  "displayName": "${lastName}",
                  "required": {
                    "roles": [
                      "user"
                    ]
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  },
                  "validations": {
                    "length": {
                      "max": 255
                    },
                    "person-name-prohibited-characters": {}
                  }
                },
                {
                  "name": "organisation",
                  "displayName": "Organisation or team",
                  "required": {
                    "roles": [
                      "user"
                    ]
                  },
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  },
                  "validations": {
                    "length": {
                      "min": 1,
                      "max": 100
                    }
                  }
                },
                {
                  "name": "access_reason",
                  "displayName": "Why do you need access?",
                  "permissions": {
                    "view": [
                      "admin",
                      "user"
                    ],
                    "edit": [
                      "admin",
                      "user"
                    ]
                  },
                  "validations": {
                    "length": {
                      "min": 0,
                      "max": 300
                    }
                  }
                }
              ],
              "groups": [
                {
                  "name": "user-metadata",
                  "displayHeader": "User metadata",
                  "displayDescription": "Attributes, which refer to user metadata"
                }
              ]
            }
    roles:
      realm:
      - name: ooh-admin
      - name: ooh-user
    clients:
    - clientId: ooh-workspace
      enabled: true
      publicClient: true
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      redirectUris:
      - https://harness.${DOMAIN}/*
      webOrigins:
      - https://harness.${DOMAIN}
      attributes:
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: "+"
      protocolMappers:
      - name: audience-ooh-harness-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-harness-api
          access.token.claim: 'true'
          id.token.claim: 'false'
      - name: organisation
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: organisation
          claim.name: organisation
          jsonType.label: String
          access.token.claim: 'true'
          id.token.claim: 'false'
          userinfo.token.claim: 'false'
      - name: access_reason
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: access_reason
          claim.name: access_reason
          jsonType.label: String
          access.token.claim: 'true'
          id.token.claim: 'false'
          userinfo.token.claim: 'false'
    - clientId: ooh-admin-console
      enabled: true
      publicClient: true
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      redirectUris:
      - https://admin.${DOMAIN}/*
      webOrigins:
      - https://admin.${DOMAIN}
      attributes:
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: "+"
        oauth2.device.authorization.grant.enabled: 'true'
      protocolMappers:
      - name: audience-ooh-control-centre
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-control-centre
          access.token.claim: 'true'
          id.token.claim: 'false'
    - clientId: ooh-harness-api
      enabled: true
      publicClient: false
      serviceAccountsEnabled: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      protocolMappers:
      - name: audience-ooh-control-centre
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-control-centre
          access.token.claim: 'true'
          id.token.claim: 'false'
      - name: audience-ooh-model-gateway
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-model-gateway
          access.token.claim: 'true'
          id.token.claim: 'false'
    - clientId: ooh-control-centre
      enabled: true
      publicClient: false
      serviceAccountsEnabled: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      protocolMappers:
      - name: audience-ooh-model-gateway
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-model-gateway
          access.token.claim: 'true'
          id.token.claim: 'false'
    - clientId: ooh-model-gateway
      enabled: true
      publicClient: false
      serviceAccountsEnabled: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      redirectUris: []
      protocolMappers:
      - name: audience-ooh-control-centre
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-control-centre
          access.token.claim: 'true'
          id.token.claim: 'false'
