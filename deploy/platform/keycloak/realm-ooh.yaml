apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: ooh
  namespace: ${PLATFORM_NAMESPACE}
spec:
  keycloakCRName: ooh-keycloak
  realm:
    realm: ooh
    enabled: true
    registrationAllowed: false
    bruteForceProtected: true
    accessTokenLifespan: 300
    roles:
      realm:
      - name: ooh-admin
      - name: ooh-user
    clients:
    - clientId: ooh-workspace
      enabled: true
      publicClient: true
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      redirectUris:
      - https://harness.${DOMAIN}/*
      webOrigins:
      - https://harness.${DOMAIN}
      attributes:
        pkce.code.challenge.method: S256
      protocolMappers:
      - name: audience-ooh-harness-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-harness-api
          access.token.claim: 'true'
          id.token.claim: 'false'
    - clientId: ooh-admin-console
      enabled: true
      publicClient: true
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      redirectUris:
      - https://admin.${DOMAIN}/*
      webOrigins:
      - https://admin.${DOMAIN}
      attributes:
        pkce.code.challenge.method: S256
        oauth2.device.authorization.grant.enabled: 'true'
      protocolMappers:
      - name: audience-ooh-control-centre
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-control-centre
          access.token.claim: 'true'
          id.token.claim: 'false'
    - clientId: ooh-harness-api
      enabled: true
      publicClient: false
      serviceAccountsEnabled: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      protocolMappers:
      - name: audience-ooh-control-centre
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-control-centre
          access.token.claim: 'true'
          id.token.claim: 'false'
      - name: audience-ooh-model-gateway
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-model-gateway
          access.token.claim: 'true'
          id.token.claim: 'false'
    - clientId: ooh-control-centre
      enabled: true
      publicClient: false
      serviceAccountsEnabled: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      protocolMappers: []
    - clientId: ooh-model-gateway
      enabled: true
      publicClient: false
      serviceAccountsEnabled: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      redirectUris: []
      protocolMappers:
      - name: audience-ooh-control-centre
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: ooh-control-centre
          access.token.claim: 'true'
          id.token.claim: 'false'
