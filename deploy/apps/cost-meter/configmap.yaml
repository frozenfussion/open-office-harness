apiVersion: v1
kind: ConfigMap
metadata:
  name: cost-meter-config
  namespace: ${APPS_NAMESPACE}
data:
  CM_OIDC_ISSUER: https://auth.${DOMAIN}/realms/ooh
  CM_KAFKA_BOOTSTRAP: ooh-kafka-kafka-bootstrap.${PLATFORM_NAMESPACE}.svc:9092
  CM_KAFKA_USERNAME: cost-meter
  OTEL_SERVICE_NAME: cost-meter
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger.${PLATFORM_NAMESPACE}.svc:4318
  OTEL_TRACES_SAMPLER: parentbased_always_on
  OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: health
