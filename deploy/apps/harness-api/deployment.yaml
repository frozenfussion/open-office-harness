apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-api
  namespace: ${APPS_NAMESPACE}
  labels:
    app: harness-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: harness-api
  template:
    metadata:
      annotations:
        ooh/config-sha256: "${CONFIG_HASH}"
      labels:
        app: harness-api
        ooh/app: real
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: migrate
        image: ghcr.io/frozenfussion/ooh-harness-api:${IMAGE_TAG}
        args: ["migrate"]
        env:
        - name: HA_DB_MIGRATE_CONNECTION
          valueFrom:
            secretKeyRef:
              name: harness-api-db
              key: migrate-connection
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: harness-api
        image: ghcr.io/frozenfussion/ooh-harness-api:${IMAGE_TAG}
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: harness-api-config
        env:
        - name: HA_DB_CONNECTION
          valueFrom:
            secretKeyRef:
              name: harness-api-db
              key: connection
        - name: HA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: harness-api-oidc
              key: client-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
