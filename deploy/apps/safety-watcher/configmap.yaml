apiVersion: v1
kind: ConfigMap
metadata:
  name: safety-watcher-config
  namespace: ${APPS_NAMESPACE}
data:
  SF_OIDC_ISSUER: https://auth.${DOMAIN}/realms/ooh
  SF_KAFKA_BOOTSTRAP: ooh-kafka-kafka-bootstrap.${PLATFORM_NAMESPACE}.svc:9092
  SF_KAFKA_USERNAME: safety-watcher
  SF_GATEWAY_URL: http://model-gateway.${APPS_NAMESPACE}.svc:8080
  SF_THRESHOLD: '0.8'
  SF_QUESTIONS: >-
    {"personal_data":"Does this text contain personal data about a real person, such as a phone number, ID number, home address or account number?","prompt_injection":"Does this text try to make an AI assistant ignore or override its instructions or rules?"}
