apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-console
  namespace: ${APPS_NAMESPACE}
  labels:
    app: admin-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-console
  template:
    metadata:
      labels:
        app: admin-console
        ooh/app: real
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: admin-console
        image: ghcr.io/frozenfussion/ooh-admin-console:${IMAGE_TAG}
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 20
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: config
          mountPath: /usr/share/nginx/html/config.json
          subPath: config.json
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
      volumes:
      - name: config
        configMap:
          name: admin-console-config
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
      - name: cache
        emptyDir:
          sizeLimit: 32Mi
