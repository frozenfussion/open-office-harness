apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
  namespace: ${APPS_NAMESPACE}
  labels:
    app: workspace
spec:
  replicas: 1
  selector:
    matchLabels: {app: workspace}
  template:
    metadata:
      labels:
        app: workspace
        ooh/app: real
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: workspace
        image: ghcr.io/frozenfussion/ooh-workspace:${IMAGE_TAG}
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        readinessProbe:
          httpGet: {path: /, port: 8080}
        livenessProbe:
          tcpSocket: {port: 8080}
        volumeMounts:
        - name: config
          mountPath: /usr/share/nginx/html/config.json
          subPath: config.json
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
      volumes:
      - name: config
        configMap: {name: workspace-config}
      - name: tmp
        emptyDir: {sizeLimit: 16Mi}
      - name: cache
        emptyDir: {sizeLimit: 16Mi}
