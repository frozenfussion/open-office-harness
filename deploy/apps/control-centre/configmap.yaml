apiVersion: v1
kind: ConfigMap
metadata:
  name: control-centre
  namespace: ${APPS_NAMESPACE}
data:
  CC_JAEGER_QUERY_URL: http://jaeger.${PLATFORM_NAMESPACE}.svc:16686
  OTEL_SERVICE_NAME: control-centre
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger.${PLATFORM_NAMESPACE}.svc:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_SAMPLER: parentbased_always_on
  CC_DISPLAY_TIME_ZONE: Asia/Kuala_Lumpur
  CC_KAFKA_BOOTSTRAP: ooh-kafka-kafka-bootstrap.${PLATFORM_NAMESPACE}.svc:9092
  CC_KAFKA_USERNAME: control-centre
  CC_OIDC_ISSUER: https://auth.${DOMAIN}/realms/ooh
  CC_OIDC_AUDIENCE: ooh-control-centre
  CC_GATEWAY_URL: http://model-gateway.${APPS_NAMESPACE}.svc:8080
  CC_HARNESS_API_URL: http://harness-api.${APPS_NAMESPACE}.svc:8080
  CC_SLIDES_WORKER_URL: http://slides-worker.${APPS_NAMESPACE}.svc:8080
  CC_AUDIT_WRITER_URL: http://audit-writer.${APPS_NAMESPACE}.svc:8080
  CC_COST_METER_URL: http://cost-meter.${APPS_NAMESPACE}.svc:8080
  CC_SAFETY_WATCHER_URL: http://safety-watcher.${APPS_NAMESPACE}.svc:8080
