[project]
name = "ooh-contract-checks"
version = "1.0.0"
requires-python = "==3.14.*"
dependencies = [
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
