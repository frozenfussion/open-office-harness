              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
  /api/admin/models:
    get:
      operationId: get_api_admin_models
      security:
      - bearerAuth: []
      description: Administrator only. Unknown input fields are refused. Ordered by
        (purpose, tier, role, model_entry_id). Optional after continues that order;
        limit is 1–200 (default 50).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelEntry'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cursor entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id001
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Last model_entry_id from the previous page; continues the original
          purpose/tier/role/id order.
    post:
      operationId: post_api_admin_models
      security:
      - bearerAuth: []
      description: Administrator only. Unknown input fields are refused.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEntry'
        '400':
          description: Invalid input
