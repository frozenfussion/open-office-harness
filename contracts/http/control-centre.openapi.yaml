openapi: 3.1.0
info:
  title: Control Centre
  version: 1.0.0
paths:
  /health:
    get:
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/rights/check:
    post:
      operationId: post_api_rights_check
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  reason:
                    type: string
                    minLength: 1
                  decided_by:
                    type: string
                    minLength: 1
                required:
                - allowed
                - reason
                - decided_by
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  minLength: 1
                action:
                  type: string
                  enum:
                  - chat.tier
                  - skill.use
                  - image.generate
                target:
                  type: string
                  minLength: 1
              required:
              - user_id
              - action
              - target
              additionalProperties: false
  /api/rights/me:
    get:
      operationId: get_api_rights_me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  chat_tiers:
                    type: array
                    items:
                      type: integer
                      minimum: 1
                  skills:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  image:
                    type: boolean
                required:
                - chat_tiers
                - skills
                - image
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
  /api/skills:
    get:
      operationId: get_api_skills
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                    title:
                      type: string
                      minLength: 1
                    kind:
                      type: string
                      enum:
                      - service
                      - instruction
                    description:
                      type: string
                      minLength: 1
                    input_schema:
                      type: string
                      minLength: 1
                    output_schema:
                      type: string
                      minLength: 1
                    right:
                      type: string
                      minLength: 1
                    needs_approval:
                      type: boolean
                    topic:
                      type: string
                      minLength: 1
                    version:
                      type: string
                      pattern: ^\d+\.\d+\.\d+$
                  required:
                  - name
                  - title
                  - kind
                  - description
                  - input_schema
                  - output_schema
                  - right
                  - needs_approval
                  - version
                  additionalProperties: false
                  allOf:
                  - if:
                      properties:
                        kind:
                          const: service
                    then:
                      required:
                      - topic
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
  /api/models:
    get:
      operationId: get_api_models
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    model_entry_id:
                      type: string
                      minLength: 1
                    purpose:
                      type: string
                      minLength: 1
                    tier:
                      type: integer
                      minimum: 1
                    role:
                      type: string
                      enum:
                      - main
                      - backup
                    location:
                      type: string
                      enum:
                      - on_prem
                      - cloud
                    api_type:
                      type: string
                      minLength: 1
                    endpoint_url:
                      type: string
                      format: uri
                      pattern: ^https?://[^\s/?#]+(?:[/?#][^\s]*)?$
                    model_id:
                      type: string
                      minLength: 1
                    secret_ref:
                      type: string
                      maxLength: 253
                      description: Legacy reference; optional and ignored by the Gateway.
                    rate_limit_per_minute:
                      type: integer
                      minimum: 1
                    daily_budget:
                      type: number
                      minimum: 0
                    health:
                      type: string
                      minLength: 1
                    title:
                      type: string
                    priority:
                      type: integer
                      minimum: 1
                      maximum: 1000
                      default: 100
                    timeout_seconds:
                      type: integer
                      minimum: 10
                      maximum: 900
                      default: 120
                    input_price_per_million:
                      type: number
                      minimum: 0
                      default: 0
                    output_price_per_million:
                      type: number
                      minimum: 0
                      default: 0
                    request_settings:
                      type: object
                      additionalProperties: true
                      default: {}
                    has_key:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
                      description: UTC creation time, used by the Gateway to break
                        priority ties.
                  required:
                  - model_entry_id
                  - purpose
                  - role
                  - location
                  - api_type
                  - endpoint_url
                  - model_id
                  - secret_ref
                  - rate_limit_per_minute
                  - daily_budget
                  - health
                  - title
                  - priority
                  - timeout_seconds
                  - input_price_per_million
                  - output_price_per_million
                  - request_settings
                  - has_key
                  - created_at
                  additionalProperties: false
                  allOf:
                  - if:
                      properties:
                        purpose:
                          const: chat
                      required:
                      - purpose
                    then:
                      required:
                      - tier
                    else:
                      not:
                        required:
                        - tier
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not exposed on port 8080
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: purpose
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: tier
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Required when purpose=chat; omit for other purposes.
      description: Gateway only on port 8081. Both registry and key routes return
        404 on port 8080. Provider keys are encrypted in the Control Centre; legacy
        secret_ref is ignored.
  /api/admin/people:
    get:
      operationId: get_api_admin_people
      security:
      - bearerAuth: []
      description: Administrator only. Unknown input fields are refused. Ordered by
        user_id. Use after with the last user_id to read the next page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id001
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Return entries after this user_id in ascending order; use the
          last user_id from the previous page.
  /api/admin/people/{user_id}:
    get:
      operationId: get_api_admin_people_user_id
      security:
      - bearerAuth: []
      description: Administrator only. Unknown input fields are refused.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: user_id
        in: path
        required: true
        schema: &id004
          type: string
          minLength: 1
  /api/admin/rights:
    get:
      operationId: get_api_admin_rights
      security:
      - bearerAuth: []
      description: Administrator only. Unknown input fields are refused. Ordered by
        key. Use after with the last key to read the next page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Right'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id001
      - name: after
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Return entries after this key in ascending order; use the last
          key from the previous page.
  /api/admin/grants:
    post:
      operationId: post_api_admin_grants
      security:
      - bearerAuth: []
      description: Administrator only. Unknown input fields are refused.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
    get:
      operationId: get_api_admin_grants
      security:
      - bearerAuth: []
      description: Administrator only; active grants ordered by id. Omit right_key
        to list all active grants, including tiers with no models.
      parameters:
      - name: right_key
        in: query
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Active grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grant'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/grants/{id}:
    delete:
      operationId: delete_api_admin_grants_id
      security:
      - bearerAuth: []
      description: Administrator only. Unknown input fields are refused.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Removed'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
