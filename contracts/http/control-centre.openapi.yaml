  /api/skill-requests:
    post:
      operationId: post_api_skill_requests
      security:
      - bearerAuth: []
      description: Harness service account only. Creates one pending request per user/skill for an approved person
        and a requestable skill. At most 20 pending per person, serialized with approval and grant changes. Rejected
        requests may retry seven days after rejection. Reason is trimmed, plain text, never logged or audited. 403
        not_approved; 400 skill_not_requestable; 409 already_requested or too_soon; 429 too_many_requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  minLength: 1
                reason:
                  type:
                  - string
                  - 'null'
                  maxLength: 300
                  description: Optional; trim before checking the 300-character maximum.
                skill:
                  type: string
                  minLength: 1
              required:
              - user_id
              - skill
              additionalProperties: false
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    const: pending
                required:
                - id
                - status
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Valid token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: already_requested when a request is pending; too_soon when the last rejection was less than
            7 days ago, with message "You can ask for this model again 7 days after the last answer".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Pending request cap reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Control Centre unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
