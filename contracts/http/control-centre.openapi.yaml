        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  minLength: 1
                tier:
                  type: integer
                reason:
                  type:
                  - string
                  - 'null'
                  maxLength: 300
                  description: Optional; trim before checking the 300-character maximum.
              required:
              - user_id
              - tier
              additionalProperties: false
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    const: pending
                required:
                - id
                - status
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Valid token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: already_requested when a request is pending; too_soon when the last rejection was less than
            7 days ago, with message "You can ask for this model again 7 days after the last answer".
