openapi: 3.1.0
info:
  title: Control Centre
  version: 1.0.0
paths:
  /health:
    get:
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/rights/check:
    post:
      operationId: post_api_rights_check
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  reason:
                    type: string
                    minLength: 1
                  decided_by:
                    type: string
                    minLength: 1
                required:
                - allowed
                - reason
                - decided_by
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  minLength: 1
                action:
                  type: string
                  enum:
                  - chat.tier
                  - skill.use
                  - image.generate
                target:
                  type: string
                  minLength: 1
              required:
              - user_id
              - action
              - target
              additionalProperties: false
  /api/rights/me:
    get:
      operationId: get_api_rights_me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  chat_tiers:
                    type: array
                    items:
                      type: integer
                      minimum: 1
                  skills:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  image:
                    type: boolean
                required:
                - chat_tiers
                - skills
                - image
