                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
      additionalProperties: false
    Grant:
      type: object
      properties:
        id: *id003
        created_at: &id009
          type: string
          format: date-time
        updated_at: *id009
        deleted_at: *id009
        created_by: *id005
        updated_by: *id005
        right_key: *id005
        subject_type:
          enum:
          - user
          - everyone
        subject_id: *id005
      required:
      - id
      - created_at
      - updated_at
      - created_by
      - updated_by
      - right_key
      - subject_type
      additionalProperties: false
    Right:
      type: object
      properties:
        id: *id003
        created_at: *id009
        updated_at: *id009
        deleted_at: *id009
        created_by: *id005
        updated_by: *id005
        key: *id005
        description: *id005
        source:
          enum:
          - tier
          - skill
          - builtin
      required:
      - id
      - created_at
      - updated_at
      - created_by
      - updated_by
      - key
      - description
      - source
      additionalProperties: false
    Person:
      type: object
      properties:
        id: *id003
        user_id: *id005
        email:
          type: string
        name:
          type: string
        first_seen_at: *id009
        last_seen_at: *id009
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
      required:
      - id
      - user_id
      - first_seen_at
      - last_seen_at
      - grants
      additionalProperties: false
    ModelEntry:
      type: object
      properties:
        model_entry_id:
          type: string
          minLength: 1
        purpose:
          type: string
          minLength: 1
        tier:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
          - main
          - backup
        location:
          type: string
          enum:
          - on_prem
          - cloud
        api_type:
          type: string
          minLength: 1
        endpoint_url:
          type: string
          format: uri
          pattern: ^https?://[^\s/?#]+(?:[/?#][^\s]*)?$
        model_id:
          type: string
          minLength: 1
        secret_ref:
          type: string
          maxLength: 253
          description: Legacy reference; optional and ignored by the Gateway.
        rate_limit_per_minute:
          type: integer
          minimum: 1
        daily_budget:
          type: number
          minimum: 0
        health:
          type: string
          enum:
          - unknown
          - ok
          - down
        title:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 900
          default: 120
        input_price_per_million:
          type: number
          minimum: 0
          default: 0
        output_price_per_million:
          type: number
          minimum: 0
          default: 0
        request_settings:
          type: object
          additionalProperties: true
          default: {}
        has_key:
          type: boolean
        created_at:
          type: string
          format: date-time
          description: UTC creation time, used by the Gateway to break priority ties.
        request_settings_thinking_off:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Null means no thinking-off switch; an object (including {}) means one is configured. Merged
            by the Gateway when thinking is false. Omit on update to keep the stored value.
        health_reason:
          type:
          - string
          - 'null'
        health_changed_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - model_entry_id
      - purpose
      - role
      - location
      - api_type
      - endpoint_url
      - model_id
      - secret_ref
      - rate_limit_per_minute
      - daily_budget
      - health
      - title
      - priority
      - timeout_seconds
      - input_price_per_million
      - output_price_per_million
      - request_settings
      - has_key
      - created_at
      - request_settings_thinking_off
      additionalProperties: false
      allOf:
      - if:
