              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters: *id003
  /api/admin/skills:
    get:
      operationId: get_api_admin_skills
      security:
      - bearerAuth: []
      description: Administrator only. Unknown input fields are refused.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillManifest'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
