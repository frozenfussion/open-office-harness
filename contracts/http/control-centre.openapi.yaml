                $ref: '#/components/schemas/Error'
        '409':
          description: Concurrent update; read the entry again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelInput'
      parameters: *id004
    delete:
      operationId: delete_api_admin_models_id
      security:
      - bearerAuth: []
      description: Administrator only. Unknown input fields are refused.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Removed'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters: *id004
  /api/admin/skills:
    get:
      operationId: get_api_admin_skills
      security:
      - bearerAuth: []
      description: Administrator only. Unknown input fields are refused.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillManifest'
        '400':
          description: Invalid input
          content:
