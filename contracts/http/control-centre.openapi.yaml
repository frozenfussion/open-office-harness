        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "name": {
                        "type": "string",
                        "minLength": 1
                      },
                      "title": {
                        "type": "string",
                        "minLength": 1
                      },
                      "kind": {
                        "type": "string",
                        "enum": [
                          "service",
                          "instruction"
                        ]
                      },
                      "description": {
                        "type": "string",
                        "minLength": 1
                      },
                      "input_schema": {
                        "type": "string",
                        "minLength": 1
                      },
                      "output_schema": {
                        "type": "string",
                        "minLength": 1
                      },
                      "right": {
                        "type": "string",
                        "minLength": 1
                      },
                      "needs_approval": {
                        "type": "boolean"
                      },
                      "topic": {
                        "type": "string",
                        "minLength": 1
                      },
                      "version": {
                        "type": "string",
                        "pattern": "^\\d+\\.\\d+\\.\\d+$"
                      }
                    },
                    "required": [
                      "name",
                      "title",
                      "kind",
                      "description",
                      "input_schema",
                      "output_schema",
                      "right",
                      "needs_approval",
                      "version"
                    ],
                    "additionalProperties": false,
                    "allOf": [
                      {
                        "if": {
                          "properties": {
                            "kind": {
                              "const": "service"
                            }
                          }
                        },
                        "then": {
                          "required": [
                            "topic"
                          ]
                        }
                      }
                    ]
                  }
