      parameters:
      - name: id
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
  /api/admin/models:
    get:
      operationId: get_api_admin_models
      security:
      - bearerAuth: []
      description: "Administrator only. Unknown input fields are refused. Ordered by (purpose, tier, role,\
        \ model_entry_id). Optional after continues that order; limit is 1\u2013200 (default 50)."
      responses:
        '200':
          description: Success
