components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
      additionalProperties: false
    Grant:
      type: object
      properties:
        id: *id002
        created_at: &id007
          type: string
          format: date-time
        updated_at: *id007
        deleted_at: *id007
        created_by: *id004
        updated_by: *id004
        right_key: *id004
        subject_type:
          enum:
          - user
          - everyone
        subject_id: *id004
      required:
      - id
      - created_at
      - updated_at
      - created_by
      - updated_by
      - right_key
      - subject_type
      additionalProperties: false
    Right:
      type: object
      properties:
        id: *id002
        created_at: *id007
        updated_at: *id007
        deleted_at: *id007
        created_by: *id004
        updated_by: *id004
        key: *id004
        description: *id004
        source:
          enum:
          - tier
          - skill
          - builtin
      required:
      - id
      - created_at
      - updated_at
      - created_by
      - updated_by
      - key
      - description
      - source
      additionalProperties: false
    Person:
      type: object
      properties:
        id: *id002
        user_id: *id004
        email:
          type: string
        name:
          type: string
        first_seen_at: *id007
        last_seen_at: *id007
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
      required:
      - id
      - user_id
      - first_seen_at
      - last_seen_at
      - grants
      additionalProperties: false
    ModelEntry:
      type: object
      properties:
        model_entry_id:
          type: string
          minLength: 1
        purpose:
          type: string
          minLength: 1
        tier:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
          - main
          - backup
        location:
          type: string
          enum:
          - on_prem
          - cloud
        api_type:
          type: string
          minLength: 1
        endpoint_url:
          type: string
          format: uri
          pattern: ^https?://[^\s/?#]+(?:[/?#][^\s]*)?$
        model_id:
          type: string
          minLength: 1
        secret_ref:
          type: string
          maxLength: 253
          description: Legacy reference; optional and ignored by the Gateway.
        rate_limit_per_minute:
          type: integer
          minimum: 1
        daily_budget:
          type: number
          minimum: 0
        health:
          type: string
          minLength: 1
        title:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 900
          default: 120
        input_price_per_million:
          type: number
          minimum: 0
          default: 0
        output_price_per_million:
          type: number
          minimum: 0
          default: 0
        request_settings:
          type: object
          additionalProperties: true
          default: {}
        has_key:
          type: boolean
        created_at:
          type: string
          format: date-time
          description: UTC creation time, used by the Gateway to break priority ties.
      required:
      - model_entry_id
      - purpose
      - role
      - location
      - api_type
      - endpoint_url
      - model_id
      - secret_ref
      - rate_limit_per_minute
      - daily_budget
      - health
      - title
      - priority
      - timeout_seconds
      - input_price_per_million
      - output_price_per_million
      - request_settings
      - has_key
      - created_at
      additionalProperties: false
      allOf:
      - if:
          properties:
            purpose:
              const: chat
          required:
          - purpose
        then:
          required:
          - tier
        else:
          not:
            required:
            - tier
    ModelInput:
      type: object
      properties:
        purpose:
          type: string
          minLength: 1
        tier:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
          - main
          - backup
        location:
          type: string
          enum:
          - on_prem
          - cloud
        api_type:
          type: string
          minLength: 1
        endpoint_url:
          type: string
          format: uri
          pattern: ^https?://[^\s/?#]+(?:[/?#][^\s]*)?$
        model_id:
          type: string
          minLength: 1
        secret_ref:
          type: string
          maxLength: 253
          description: Legacy reference; optional and ignored by the Gateway.
        rate_limit_per_minute:
          type: integer
          minimum: 1
        daily_budget:
          type: number
          minimum: 0
        title:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 900
          default: 120
        input_price_per_million:
          type: number
          minimum: 0
          default: 0
        output_price_per_million:
          type: number
          minimum: 0
          default: 0
        request_settings:
          type: object
          additionalProperties: true
          default: {}
        api_key:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Omit to keep; empty removes; endpoint or connection changes
            remove the saved key unless replaced.
      required:
      - purpose
      - role
      - location
      - api_type
      - endpoint_url
      - model_id
      - rate_limit_per_minute
      - daily_budget
      additionalProperties: false
      allOf:
      - if:
          properties:
            purpose:
              const: chat
          required:
          - purpose
        then:
          required:
          - tier
        else:
          not:
            required:
            - tier
    SkillManifest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
          - service
          - instruction
        description:
          type: string
          minLength: 1
        input_schema:
          type: string
          minLength: 1
        output_schema:
          type: string
          minLength: 1
        right:
          type: string
          minLength: 1
        needs_approval:
          type: boolean
        topic:
          type: string
          minLength: 1
        version:
          type: string
          pattern: ^\d+\.\d+\.\d+$
      required:
      - name
      - title
      - kind
      - description
      - input_schema
      - output_schema
      - right
      - needs_approval
      - version
      additionalProperties: false
      allOf:
      - if:
          properties:
            kind:
              const: service
        then:
          required:
          - topic
    GrantInput:
      type: object
      properties:
        right_key: *id004
        subject_type:
          type: string
          enum:
          - user
          - everyone
        subject_id:
          type:
          - string
          - 'null'
          minLength: 1
      required:
      - right_key
      - subject_type
      additionalProperties: false
      allOf:
      - if:
          properties:
            subject_type:
              const: user
        then:
          required:
          - subject_id
          properties:
            subject_id: *id004
        else:
          properties:
            subject_id:
              type: 'null'
    Approval:
      type: object
      properties:
        id: *id002
        created_at: *id007
        updated_at: *id007
        deleted_at: *id007
        created_by: *id004
        updated_by: *id004
        request_event_id: *id002
        correlation_id: *id002
        requester_user_id: *id004
        producer: *id004
        action: *id004
        details:
          type: object
        risk: *id004
        requested_by: *id004
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        decided_by: *id004
        note:
          type: string
        decided_at: *id007
      required:
      - id
      - created_at
      - updated_at
      - created_by
      - updated_by
      - request_event_id
      - correlation_id
      - requester_user_id
      - producer
      - action
      - details
      - risk
      - requested_by
      - status
      additionalProperties: false
    Decision:
      type: object
      properties:
        approved:
          type: boolean
        note:
          type: string
      required:
      - approved
      - note
      additionalProperties: false
    AuditRow:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        occurred_at: *id007
        actor: *id004
        action: *id004
        target: *id004
        outcome: *id004
        detail:
          type: object
        correlation_id: *id002
      required:
      - id
      - occurred_at
      - actor
      - action
      - target
      - outcome
      - detail
      - correlation_id
      additionalProperties: false
    Removed:
      type: object
      properties:
        status:
          const: removed
      required:
      - status
      additionalProperties: false
    ModelTestResult:
      oneOf:
      - type: object
        properties:
          ok:
            const: true
          model_title:
            type: string
          reply:
            type: string
          duration_ms:
            type: integer
            minimum: 0
          usage:
            type: object
            properties:
              input_tokens:
                type: integer
                minimum: 0
              output_tokens:
                type: integer
                minimum: 0
            required:
            - input_tokens
            - output_tokens
            additionalProperties: false
          cost_usd:
            type: number
            minimum: 0
        required:
        - ok
        - model_title
        - reply
        - duration_ms
        - usage
        - cost_usd
        additionalProperties: false
      - type: object
        properties:
          ok:
            const: false
          reason:
            type: string
          provider_status:
            type:
            - integer
            - 'null'
            minimum: 100
            maximum: 599
          provider_message:
            type:
            - string
            - 'null'
            maxLength: 300
        required:
        - ok
        - reason
        - provider_status
        - provider_message
        additionalProperties: false
