            - mime
            - summary
            additionalProperties: false
          - type: 'null'
        error:
          anyOf:
          - *id006
          - type: 'null'
      required:
      - job_id
      - skill
      - title
      - label
      - status
      - created_at
      - updated_at
      - output
      - error
      additionalProperties: false
    Picture:
