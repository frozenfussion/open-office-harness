# SPDX-License-Identifier: AGPL-3.0-only
openapi: 3.1.0
info:
  title: Harness API
  version: 2.0.0
paths:
  /health:
    get:
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/conversations:
    post:
      operationId: post_api_conversations
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                - id
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
    get:
      operationId: get_api_conversations
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'
        '400':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: before
        in: query
        description: Conversation ID from the previous page. Own active conversations
          only. Ordered by updated_at then id, descending.
        schema: &id001
          type: string
          format: uuid
  /api/conversations/{id}/messages:
    post:
      operationId: post_api_conversations_id_messages
      description: Runs at most two tool rounds. Follow-ups stay pinned to the first
        entry. Provider reasoning is private database state and is sent only to the
        Gateway; it is never included in browser events or conversation routes. Upload
        ownership, prior use and may_attach are checked before storing the question
        or making paid calls. A budget fallback rights failure after storage is 503
        unavailable. Up to three newest pictures whose next message completed are
        read at call time, from the last twenty history messages plus the current
        message; missing files are skipped. Auto routing and title calls use text
        only.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                oneOf:
                - type: object
                  properties:
                    type:
                      const: delta
                    text: &id002
                      type: string
                  required:
                  - type
                  - text
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: completed
                    message_id: *id001
                    tier: &id004
                      type: integer
                      minimum: 1
                    model_title: *id002
                    usage:
                      $ref: '#/components/schemas/Usage'
                    note: &id009
                      type:
                      - string
                      - 'null'
                    routing:
                      $ref: '#/components/schemas/Routing'
                    thinking_applied:
                      type: boolean
                  required:
                  - type
                  - message_id
                  - tier
                  - model_title
                  - usage
                  - note
                  - thinking_applied
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: failed
                    error:
                      $ref: '#/components/schemas/Error'
                  required:
                  - type
                  - error
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: title
                    conversation_id:
                      type: string
                      format: uuid
                    title:
                      type: string
                      minLength: 1
                      maxLength: 60
                  required:
                  - type
                  - conversation_id
                  - title
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: thinking
                    text:
                      type: string
                      minLength: 1
                  required:
                  - type
                  - text
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: job
                    job_id: &id007
                      type: string
                      format: uuid
                    skill:
                      type: string
                    title:
                      type: string
                    label:
                      type: string
                      maxLength: 80
                    status:
                      enum:
                      - queued
                      - awaiting_approval
                      - failed
                    error: &id006
                      $ref: '#/components/schemas/Error'
                  required:
                  - type
                  - job_id
                  - skill
                  - title
                  - label
                  - status
                  additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: no_tier, tier_not_allowed or not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or upload_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'upload_used: picture already attached, including a concurrent
            send'
          content:
            application/json:
              schema: &id003
                $ref: '#/components/schemas/Error'
        '502':
          description: 'image_refused: This model could not read the picture. Try
            another model.'
          content:
            application/json:
              schema: *id003
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  pattern: \S
                tier:
                  anyOf:
                  - *id004
                  - const: auto
                  - type: 'null'
                thinking:
                  type: boolean
                  default: true
                upload_id:
                  anyOf:
                  - &id008
                    type: string
                    format: uuid
                  - type: 'null'
              required:
              - content
              additionalProperties: false
  /api/uploads:
    post:
      operationId: post_api_uploads
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Picture stored
          content:
            application/json:
              schema: &id011
                $ref: '#/components/schemas/Picture'
        '400':
          description: unsupported_type or empty body invalid_input
          content:
            application/json:
              schema: *id003
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: *id003
        '413':
          description: 'too_large: This picture is larger than the limit of <n> MB.'
          content:
            application/json:
              schema: *id003
        '429':
          description: 'upload_limit: You have reached today''s limit for pictures.'
          content:
            application/json:
              schema: *id003
        '503':
          description: storage_unavailable; no row recorded when writing fails
          content:
            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      description: 'Raw PNG or JPEG, maximum HA_UPLOAD_MAX_BYTES (whole MiB from 1
        to 7). Content-Type parameters are ignored. Checks: token, type, daily UTC
        count, empty body, magic bytes, size, write. Reads stop at limit plus one
        byte. The name is percent-decoded UTF-8; retain basename after slash or backslash,
        replace characters outside [A-Za-z0-9._ -] with underscore, strip leading
        dots/spaces, remove extension, truncate stem to keep total length <=100, append
        .png or .jpg. Empty/undecodable names use picture. Stored unchanged under
        uploads/<upload id>/<safe name> through a temporary file and rename, then
        the row is saved and upload.created audit is attempted (MIME target, new correlation
        id); audit failure never fails upload.'
      parameters:
      - name: X-File-Name
        in: header
        required: false
        schema:
          type: string
        description: Optional percent-encoded UTF-8 name; invalid names fall back
          to picture.png or picture.jpg.
  /api/events:
    get:
      operationId: get_api_events
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - job.queued
                    - job.awaiting_approval
                    - job.completed
                    - job.failed
                  correlation_id:
                    type: string
                    format: uuid
                  output:
                    anyOf:
                    - type: object
                      properties:
                        file_key:
                          type: string
                          minLength: 1
                        mime:
                          type: string
                        summary:
                          type: string
                          minLength: 1
                      required:
                      - file_key
                      - mime
                      - summary
                      additionalProperties: false
                    - type: 'null'
                  error:
                    anyOf:
                    - $ref: '#/components/schemas/Error'
                    - type: 'null'
                  skill:
                    type: string
                    pattern: ^[a-z][a-z0-9-]*$
                required:
                - type
                - correlation_id
                - skill
                - output
                - error
                additionalProperties: false
                oneOf:
                - properties:
                    type:
                      enum:
                      - job.completed
                    output:
                      type: object
                    error:
                      type: 'null'
                - properties:
                    type:
                      enum:
                      - job.failed
                    output:
                      type: 'null'
                    error:
                      type: object
                - properties:
                    type:
                      enum:
                      - job.queued
                      - job.awaiting_approval
                    output:
                      type: 'null'
                    error:
                      type: 'null'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'User-scoped job events. Sends : keep-alive comments every 15 seconds.
        Reload /api/jobs on every reconnect. Closes when the verified access token
        expires.'
  /api/me:
    get:
      operationId: get_api_me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    minLength: 1
                  name: *id002
                  chat_tiers:
                    type: array
                    items: *id004
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        name: *id002
                        title: *id002
                      required:
                      - name
                      - title
                      additionalProperties: false
                  access:
                    type: string
                    enum:
                    - approved
                    - pending
                    - rejected
                    - closed
                  chat_tier_titles:
                    type: object
                    additionalProperties:
                      type: string
                    description: Tier-to-title map from the Control Centre, with string
                      tier keys. The title comes from the active main entry with lowest
                      priority, then created_at; a missing entry has no map value.
                  chat_tier_thinking_switch:
                    type: object
                    additionalProperties:
                      type: boolean
                  requestable_tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        tier:
                          type: integer
                          minimum: 1
                        title:
                          type: string
                        requested:
                          enum:
                          - pending
                          - rejected
                          - null
                      required:
                      - tier
                      - title
                      - requested
                      additionalProperties: false
                  requestable_skills:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        requested:
                          enum:
                          - pending
                          - rejected
                          - null
                      required:
                      - name
                      - title
                      - description
                      - requested
                      additionalProperties: false
                  upload_max_bytes:
                    type: integer
                    minimum: 1048576
                    maximum: 7340032
                    multipleOf: 1048576
                required:
                - user_id
                - name
                - chat_tiers
                - skills
                - access
                - chat_tier_titles
                - chat_tier_thinking_switch
                - requestable_tiers
                - requestable_skills
                - upload_max_bytes
                additionalProperties: false
        '400':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Observe access first through the Control Centre using the Harness
        service token and verified user claims, including is_admin from realm_access.roles.
        Missing/non-string profile claims become null; strings are trimmed then limited:
        name 200, email 320, organisation 100, access_reason 300. The exact sub is
        preserved. Then read rights and skills. Observe or rights failure returns
        503 rights_unavailable. Closed means new requests are temporarily full. Pass
        chat_tier_titles through from the Control Centre.'
  /api/conversations/{id}:
    get:
      operationId: get_api_conversations_id
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id001
                  title: *id002
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                required:
                - id
                - title
                - messages
                additionalProperties: false
        '400':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/tier-requests:
    post:
      operationId: post_api_tier_requests
      security:
      - bearerAuth: []
      description: Forwards a request using the verified sub and Harness service token.
        The Control Centre enforces approved access, requestable tiers, a seven-day
        rejection wait and at most 20 pending requests per user. No caller-supplied
        user_id. Reason is never logged. Unavailable or invalid upstream responses
        return 503 rights_unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: integer
                  minimum: 1
                reason:
                  anyOf:
                  - type: string
                    maxLength: 300
                  - type: 'null'
              required:
              - tier
              additionalProperties: false
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    const: pending
                required:
                - id
                - status
                additionalProperties: false
        '400':
          description: invalid_input or tier_not_requestable
          content: &id005
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content: *id005
        '403':
          description: not_approved
          content: *id005
        '409':
          description: 'already_requested or too_soon. too_soon means the last rejection
            was less than 7 days ago: You can ask for this model again 7 days after
            the last answer.'
          content: *id005
        '429':
          description: too_many_requests
          content: *id005
        '503':
          description: rights_unavailable
          content: *id005
  /api/jobs/{job_id}/file:
    get:
      operationId: get_api_jobs_job_id_file
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        '400':
          description: Success
          content:
            application/json:
              schema: *id006
        '401':
          description: Success
          content:
            application/json:
              schema: *id006
        '404':
          description: Success
          content:
            application/json:
              schema: *id006
        '503':
          description: Success
          content:
            application/json:
              schema: *id006
      parameters:
      - name: job_id
        in: path
        required: true
        schema: *id007
      description: Streams the completed job file owned by the verified user; resolved
        paths must stay under /files/outputs/. Other users and unknown, incomplete
        or missing files receive 404.
  /api/jobs:
    get:
      operationId: get_api_jobs
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '400':
          description: Success
          content:
            application/json:
              schema: *id006
        '401':
          description: Success
          content:
            application/json:
              schema: *id006
        '404':
          description: Success
          content:
            application/json:
              schema: *id006
        '503':
          description: Success
          content:
            application/json:
              schema: *id006
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: before
        in: query
        description: Conversation ID from the previous page. Own active conversations
          only. Ordered by updated_at then id, descending.
        schema:
          type: string
          format: uuid
  /api/skill-requests:
    post:
      operationId: post_api_skill_requests
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id007
                  status:
                    const: pending
                required:
                - id
                - status
                additionalProperties: false
        '400':
          description: Success
          content:
            application/json:
              schema: *id006
        '401':
          description: Success
          content:
            application/json:
              schema: *id006
        '403':
          description: Success
          content:
            application/json:
              schema: *id006
        '409':
          description: Success
          content:
            application/json:
              schema: *id006
        '429':
          description: Success
          content:
            application/json:
              schema: *id006
        '503':
          description: Success
          content:
            application/json:
              schema: *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skill:
                  type: string
                  pattern: ^[a-z][a-z0-9-]*$
                reason:
                  type:
                  - string
                  - 'null'
                  maxLength: 300
              required:
              - skill
              additionalProperties: false
  /api/uploads/{upload_id}:
    get:
      operationId: get_api_upload
      security:
      - bearerAuth: []
      parameters:
      - name: upload_id
        in: path
        required: true
        schema: *id008
      description: Owner only; missing disk file also 404. Resolved path stays under
        uploads; symlinks refused.
      responses:
        '200':
          description: Stored picture
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, max-age=3600
            X-Content-Type-Options:
              schema:
                type: string
              description: nosniff
            Content-Disposition:
              schema:
                type: string
              description: inline
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Malformed id
          content:
            application/json:
              schema: *id003
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: *id003
        '404':
          description: Upload not found or file missing
          content:
            application/json:
              schema: *id003
  /api/conversations/{id}/export:
    get:
      operationId: get_api_conversation_export
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id008
      description: 'Owner-only Word export in memory: title, started/exported times
        in HA_DISPLAY_TIME_ZONE with zone short name, completed nonempty questions
        and answers in order, You/Assistant labels and stored tier/model title, picture
        filename placeholder. User text is literal with line breaks; assistant Markdown
        formatting is retained (headings, lists, tables, code, quotes, links); raw
        HTML and LaTeX stay literal. No Thinking, reasoning state, routing notes,
        token counts or personal identifiers. Audit conversation.exported targets
        docx, correlation id is conversation id; unavailable/failed audit never fails
        export. Filename is lowercase title, runs outside [a-z0-9] replaced by dash,
        trimmed, at most 60 characters, or chat.'
      responses:
        '200':
          description: Word document
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="<slug>.docx"
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          description: Malformed id
          content:
            application/json:
              schema: *id003
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: *id003
        '404':
          description: Conversation not found
          content:
            application/json:
              schema: *id003
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
      additionalProperties: false
    Usage:
      type: object
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
      required:
      - input_tokens
      - output_tokens
      additionalProperties: false
    ConversationSummary:
      type: object
      properties:
        id: *id001
        title: *id002
        updated_at: &id010
          type: string
          format: date-time
      required:
      - id
      - title
      - updated_at
      additionalProperties: false
    Routing:
      type: object
      description: Present for Auto routing. Scores are suggestions; rights decide.
        When a forced skill was not applied and no tool was called, note says "The
        model chose not to use <skill title>."
      properties:
        tier:
          type: integer
          minimum: 1
        scores:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        skill:
          type: string
        note:
          type: string
      required:
      - tier
      - scores
      additionalProperties: false
    Message:
      type: object
      properties:
        id: *id001
        role:
          enum:
          - user
          - assistant
        content: *id002
        tier:
          type:
          - integer
          - 'null'
          minimum: 1
        model_entry_id:
          type:
          - string
          - 'null'
          format: uuid
        model_title: *id009
        input_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
        output_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
        routing:
          anyOf:
          - $ref: '#/components/schemas/Routing'
          - type: 'null'
        note: *id009
        outcome:
          enum:
          - completed
          - failed
          - tool_requested
        created_at: *id010
        thinking:
          type:
          - string
          - 'null'
          description: Concatenated assistant thinking, separate from answer content.
            Null when absent or for older messages. Never logged or sent back to a
            model. At most the first 100000 characters per message are stored; later
            thinking continues streaming.
          maxLength: 100000
        picture:
          anyOf:
          - *id011
          - type: 'null'
      required:
      - id
      - role
      - content
      - tier
      - model_entry_id
      - model_title
      - input_tokens
      - output_tokens
      - note
      - outcome
      - created_at
      - thinking
      - picture
      additionalProperties: false
    Job:
      type: object
      properties:
        job_id: *id007
        skill:
          type: string
        title:
          type: string
        label:
          type: string
          maxLength: 80
        status:
          enum:
          - awaiting_approval
          - queued
          - completed
          - failed
          - rejected
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        output:
