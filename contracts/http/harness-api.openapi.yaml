openapi: 3.1.0
info:
  title: Harness API
  version: 2.0.0
paths:
  /health:
    get:
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/conversations:
    post:
      operationId: post_api_conversations
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                - id
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
    get:
      operationId: get_api_conversations
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'
        '400':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: before
        in: query
        description: Conversation ID from the previous page. Own active conversations
          only. Ordered by updated_at then id, descending.
        schema: &id001
          type: string
          format: uuid
  /api/conversations/{id}/messages:
    post:
      operationId: post_api_conversations_id_messages
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                oneOf:
                - type: object
                  properties:
                    type:
                      const: delta
                    text: &id002
                      type: string
                  required:
                  - type
                  - text
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: completed
                    message_id: *id001
                    tier: &id003
                      type: integer
                      minimum: 1
                    model_title: *id002
                    usage:
                      $ref: '#/components/schemas/Usage'
                    note: &id004
                      type:
                      - string
                      - 'null'
                  required:
                  - type
                  - message_id
                  - tier
                  - model_title
                  - usage
                  - note
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: failed
                    error:
                      $ref: '#/components/schemas/Error'
                  required:
                  - type
                  - error
                  additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'SSE: one JSON object per data line, no event lines; delta events
        then completed or failed. Rights are checked before storing the user message.
        Gateway errors before the first event are JSON. Headers: Cache-Control: no-store,
        X-Accel-Buffering: no. Only user tokens with audience ooh-harness-api are
        accepted. No caller-supplied user_id.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  pattern: \S
                tier:
                  anyOf:
                  - *id003
                  - type: 'null'
              required:
              - content
              additionalProperties: false
  /api/uploads:
    post:
      operationId: post_api_uploads
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_key:
                    type: string
                    minLength: 1
                required:
                - file_key
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
              additionalProperties: false
      description: Stage 2 always returns 503 not_built_yet after authentication and
        query validation. Success schemas are reserved for Stage 3.
  /api/events:
    get:
      operationId: get_api_events
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - job.queued
                    - job.awaiting_approval
                    - job.completed
                    - job.failed
                  correlation_id:
                    type: string
                    format: uuid
                  output:
                    anyOf:
                    - type: object
                      properties:
                        file_key:
                          type: string
                          minLength: 1
                        mime:
                          type: string
                        summary:
                          type: string
                          minLength: 1
                      required:
                      - file_key
                      - mime
                      - summary
                      additionalProperties: false
                    - type: 'null'
                  error:
                    anyOf:
                    - $ref: '#/components/schemas/Error'
                    - type: 'null'
                  skill:
                    type: string
                    pattern: ^[a-z][a-z0-9-]*$
                required:
                - type
                - correlation_id
                - skill
                - output
                - error
                additionalProperties: false
                oneOf:
                - properties:
                    type:
                      enum:
                      - job.completed
                    output:
                      type: object
                    error:
                      type: 'null'
                - properties:
                    type:
                      enum:
                      - job.failed
                    output:
                      type: 'null'
                    error:
                      type: object
                - properties:
                    type:
                      enum:
                      - job.queued
                      - job.awaiting_approval
                    output:
                      type: 'null'
                    error:
                      type: 'null'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Stage 2 always returns 503 not_built_yet after authentication and
        query validation. Success schemas are reserved for Stage 3.
  /api/files/{key}:
    get:
      operationId: get_api_files_key
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    pattern: ^https?://[^\s/?#]+(?:[/?#][^\s]*)?$
                  expires_at:
                    type: string
                    format: date-time
                    pattern: Z$
                required:
                - url
                - expires_at
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      description: Stage 2 always returns 503 not_built_yet after authentication and
        query validation. Success schemas are reserved for Stage 3.
  /api/me:
    get:
      operationId: get_api_me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    minLength: 1
                  name: *id002
                  chat_tiers:
                    type: array
                    items: *id003
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        name: *id002
                        title: *id002
                      required:
                      - name
                      - title
                      additionalProperties: false
                  access:
                    type: string
                    enum:
                    - approved
                    - pending
                    - rejected
                    - closed
                required:
                - user_id
                - name
                - chat_tiers
                - skills
                - access
                additionalProperties: false
        '400':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Observe access first through the Control Centre using the Harness
        service token and verified user claims, including is_admin from realm_access.roles.
        Missing/non-string profile claims become null; strings are trimmed then limited:
        name 200, email 320, organisation 100, access_reason 300. The exact sub is
        preserved. Then read rights and skills. Observe or rights failure returns
        503 rights_unavailable. Closed means new requests are temporarily full.'
  /api/conversations/{id}:
    get:
      operationId: get_api_conversations_id
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id001
                  title: *id002
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                required:
                - id
                - title
                - messages
                additionalProperties: false
        '400':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
      additionalProperties: false
    Usage:
      type: object
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
      required:
      - input_tokens
      - output_tokens
      additionalProperties: false
    ConversationSummary:
      type: object
      properties:
        id: *id001
        title: *id002
        updated_at: &id005
          type: string
          format: date-time
      required:
      - id
      - title
      - updated_at
      additionalProperties: false
    Message:
      type: object
      properties:
        id: *id001
        role:
          enum:
          - user
          - assistant
        content: *id002
        tier:
          type:
          - integer
          - 'null'
          minimum: 1
        model_entry_id:
          type:
          - string
          - 'null'
          format: uuid
        model_title: *id004
        input_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
        output_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
        note: *id004
        outcome:
          enum:
          - completed
          - failed
          - tool_requested
        created_at: *id005
      required:
      - id
      - role
      - content
      - tier
      - model_entry_id
      - model_title
      - input_tokens
      - output_tokens
      - note
      - outcome
      - created_at
      additionalProperties: false
