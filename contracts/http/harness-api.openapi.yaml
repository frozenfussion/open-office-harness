openapi: 3.1.0
info:
  title: Harness API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/conversations:
    post:
      operationId: post_api_conversations
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                - id
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
  /api/conversations/{id}/messages:
    post:
      operationId: post_api_conversations_id_messages
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - delta
                    - completed
                    - failed
                  text:
                    type: string
                  error:
                    $ref: '#/components/schemas/Error'
                required:
                - type
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'SSE: each data field is one JSON value matching the response schema.
        Events end with a blank line.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                attachments:
                  type: array
                  items:
                    type: string
                    minLength: 1
              required:
              - content
              additionalProperties: false
  /api/uploads:
    post:
      operationId: post_api_uploads
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_key:
                    type: string
                    minLength: 1
                required:
                - file_key
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
              additionalProperties: false
  /api/events:
    get:
      operationId: get_api_events
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - job.queued
                    - job.awaiting_approval
                    - job.completed
                    - job.failed
                  correlation_id:
                    type: string
                    format: uuid
                  output:
                    anyOf:
                    - type: object
                      properties:
                        file_key:
                          type: string
                          minLength: 1
                        mime:
                          type: string
                        summary:
                          type: string
                          minLength: 1
                      required:
                      - file_key
                      - mime
                      - summary
                      additionalProperties: false
                    - type: 'null'
                  error:
                    anyOf:
                    - $ref: '#/components/schemas/Error'
                    - type: 'null'
                  skill:
                    type: string
                    pattern: ^[a-z][a-z0-9-]*$
                required:
                - type
                - correlation_id
                - skill
                - output
                - error
                additionalProperties: false
                oneOf:
                - properties:
                    type:
                      enum:
                      - job.completed
                    output:
                      type: object
                    error:
                      type: 'null'
                - properties:
                    type:
                      enum:
                      - job.failed
                    output:
                      type: 'null'
                    error:
                      type: object
                - properties:
                    type:
                      enum:
                      - job.queued
                      - job.awaiting_approval
                    output:
                      type: 'null'
                    error:
                      type: 'null'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'SSE: each data field is one JSON value matching the response schema.
        Events end with a blank line.'
  /api/files/{key}:
    get:
      operationId: get_api_files_key
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    pattern: ^https?://[^\s/?#]+(?:[/?#][^\s]*)?$
                  expires_at:
                    type: string
                    format: date-time
                    pattern: Z$
                required:
                - url
                - expires_at
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      description: The object key is URL encoded as a single path parameter. Verify
        ownership before returning a short-lived signed URL.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
      additionalProperties: false
