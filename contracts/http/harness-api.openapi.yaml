# SPDX-License-Identifier: AGPL-3.0-only
openapi: 3.1.0
info:
  title: Harness API
  version: 2.0.0
paths:
  /health:
    get:
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/conversations:
    post:
      operationId: post_api_conversations
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                - id
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
    get:
      operationId: get_api_conversations
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'
        '400':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: before
        in: query
        description: Conversation ID from the previous page. Own active conversations only. Ordered by
          updated_at then id, descending.
        schema: &id001
          type: string
          format: uuid
  /api/conversations/{id}/messages:
    post:
      operationId: post_api_conversations_id_messages
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                oneOf:
                - type: object
                  properties:
                    type:
                      const: delta
                    text: &id002
                      type: string
                  required:
                  - type
                  - text
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: completed
                    message_id: *id001
                    tier: &id003
                      type: integer
                      minimum: 1
                    model_title: *id002
                    usage:
                      $ref: '#/components/schemas/Usage'
                    note: &id007
                      type:
                      - string
                      - 'null'
                    thinking_applied:
                      type: boolean
                  required:
                  - type
                  - message_id
                  - tier
                  - model_title
                  - usage
                  - note
                  - thinking_applied
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: failed
                    error:
                      $ref: '#/components/schemas/Error'
                  required:
                  - type
                  - error
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: title
                    conversation_id:
                      type: string
                      format: uuid
                    title:
                      type: string
                      minLength: 1
                      maxLength: 60
                  required:
                  - type
                  - conversation_id
                  - title
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: thinking
                    text:
                      type: string
                      minLength: 1
                  required:
                  - type
                  - text
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: job
                    job_id: &id006
                      type: string
                      format: uuid
                    skill:
                      type: string
                    title:
                      type: string
                    label:
                      type: string
                      maxLength: 80
                    status:
                      enum:
                      - queued
                      - awaiting_approval
                      - failed
                    error: &id005
                      $ref: '#/components/schemas/Error'
                  required:
                  - type
                  - job_id
                  - skill
                  - title
                  - label
                  - status
                  additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Runs at most two tool rounds. Follow-ups stay pinned to the first entry. Provider reasoning
        is private database state and is sent only to the Gateway; it is never included in browser events
        or conversation routes.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  pattern: \S
                tier:
                  anyOf:
                  - *id003
                  - type: 'null'
                thinking:
                  type: boolean
                  default: true
              required:
              - content
              additionalProperties: false
  /api/uploads:
    post:
      operationId: post_api_uploads
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_key:
                    type: string
                    minLength: 1
                required:
                - file_key
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
              additionalProperties: false
      description: 'Always returns 503 not_built_yet: Uploads are not built yet.'
  /api/events:
    get:
      operationId: get_api_events
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - job.queued
                    - job.awaiting_approval
                    - job.completed
                    - job.failed
                  correlation_id:
                    type: string
                    format: uuid
                  output:
                    anyOf:
                    - type: object
                      properties:
                        file_key:
                          type: string
                          minLength: 1
                        mime:
                          type: string
                        summary:
                          type: string
                          minLength: 1
                      required:
                      - file_key
                      - mime
                      - summary
                      additionalProperties: false
                    - type: 'null'
                  error:
                    anyOf:
                    - $ref: '#/components/schemas/Error'
                    - type: 'null'
                  skill:
                    type: string
                    pattern: ^[a-z][a-z0-9-]*$
                required:
                - type
                - correlation_id
                - skill
                - output
                - error
                additionalProperties: false
                oneOf:
                - properties:
                    type:
                      enum:
                      - job.completed
                    output:
                      type: object
                    error:
                      type: 'null'
                - properties:
                    type:
                      enum:
                      - job.failed
                    output:
                      type: 'null'
                    error:
                      type: object
                - properties:
                    type:
                      enum:
                      - job.queued
                      - job.awaiting_approval
                    output:
                      type: 'null'
                    error:
                      type: 'null'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'User-scoped job events. Sends : keep-alive comments every 15 seconds. Reload /api/jobs
        on every reconnect. Closes when the verified access token expires.'
  /api/me:
    get:
      operationId: get_api_me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    minLength: 1
                  name: *id002
                  chat_tiers:
                    type: array
                    items: *id003
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        name: *id002
                        title: *id002
                      required:
                      - name
                      - title
                      additionalProperties: false
                  access:
                    type: string
                    enum:
                    - approved
                    - pending
                    - rejected
                    - closed
                  chat_tier_titles:
                    type: object
                    additionalProperties:
                      type: string
                    description: Tier-to-title map from the Control Centre, with string tier keys. The
                      title comes from the active main entry with lowest priority, then created_at; a
                      missing entry has no map value.
                  chat_tier_thinking_switch:
                    type: object
                    additionalProperties:
                      type: boolean
                  requestable_tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        tier:
                          type: integer
                          minimum: 1
                        title:
                          type: string
                        requested:
                          enum:
                          - pending
                          - rejected
                          - null
                      required:
                      - tier
                      - title
                      - requested
                      additionalProperties: false
                  requestable_skills:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        requested:
                          enum:
                          - pending
                          - rejected
                          - null
                      required:
                      - name
                      - title
                      - description
                      - requested
                      additionalProperties: false
                required:
                - user_id
                - name
                - chat_tiers
                - skills
                - access
                - chat_tier_titles
                - chat_tier_thinking_switch
                - requestable_tiers
                - requestable_skills
                additionalProperties: false
        '400':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Observe access first through the Control Centre using the Harness service token and
        verified user claims, including is_admin from realm_access.roles. Missing/non-string profile claims
        become null; strings are trimmed then limited: name 200, email 320, organisation 100, access_reason
        300. The exact sub is preserved. Then read rights and skills. Observe or rights failure returns
        503 rights_unavailable. Closed means new requests are temporarily full. Pass chat_tier_titles
        through from the Control Centre.'
  /api/conversations/{id}:
    get:
      operationId: get_api_conversations_id
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id001
                  title: *id002
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                required:
                - id
                - title
                - messages
                additionalProperties: false
        '400':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/tier-requests:
    post:
      operationId: post_api_tier_requests
      security:
      - bearerAuth: []
      description: Forwards a request using the verified sub and Harness service token. The Control Centre
        enforces approved access, requestable tiers, a seven-day rejection wait and at most 20 pending
        requests per user. No caller-supplied user_id. Reason is never logged. Unavailable or invalid
        upstream responses return 503 rights_unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: integer
                  minimum: 1
                reason:
                  anyOf:
                  - type: string
                    maxLength: 300
                  - type: 'null'
              required:
              - tier
              additionalProperties: false
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    const: pending
                required:
                - id
                - status
                additionalProperties: false
        '400':
          description: invalid_input or tier_not_requestable
          content: &id004
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content: *id004
        '403':
          description: not_approved
          content: *id004
        '409':
          description: 'already_requested or too_soon. too_soon means the last rejection was less than
            7 days ago: You can ask for this model again 7 days after the last answer.'
          content: *id004
        '429':
          description: too_many_requests
          content: *id004
        '503':
          description: rights_unavailable
          content: *id004
  /api/jobs/{job_id}/file:
    get:
      operationId: get_api_jobs_job_id_file
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        '400':
          description: Success
          content:
            application/json:
              schema: *id005
        '401':
          description: Success
          content:
            application/json:
              schema: *id005
        '404':
          description: Success
          content:
            application/json:
              schema: *id005
        '503':
          description: Success
          content:
            application/json:
              schema: *id005
      parameters:
      - name: job_id
        in: path
        required: true
        schema: *id006
      description: Streams the completed job file owned by the verified user; resolved paths must stay
        under /files/outputs/. Other users and unknown, incomplete or missing files receive 404.
  /api/jobs:
    get:
      operationId: get_api_jobs
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '400':
          description: Success
          content:
            application/json:
              schema: *id005
        '401':
          description: Success
          content:
            application/json:
              schema: *id005
        '404':
          description: Success
          content:
            application/json:
              schema: *id005
        '503':
          description: Success
          content:
            application/json:
              schema: *id005
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: before
        in: query
        description: Conversation ID from the previous page. Own active conversations only. Ordered by
          updated_at then id, descending.
        schema:
          type: string
          format: uuid
  /api/skill-requests:
    post:
      operationId: post_api_skill_requests
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id006
                  status:
                    const: pending
                required:
                - id
                - status
                additionalProperties: false
        '400':
          description: Success
          content:
            application/json:
              schema: *id005
        '401':
          description: Success
          content:
            application/json:
              schema: *id005
        '403':
          description: Success
          content:
            application/json:
              schema: *id005
        '409':
          description: Success
          content:
            application/json:
              schema: *id005
        '429':
          description: Success
          content:
            application/json:
              schema: *id005
        '503':
          description: Success
          content:
            application/json:
              schema: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skill:
                  type: string
                  pattern: ^[a-z][a-z0-9-]*$
                reason:
                  type:
                  - string
                  - 'null'
                  maxLength: 300
              required:
              - skill
              additionalProperties: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
      additionalProperties: false
    Usage:
      type: object
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
      required:
      - input_tokens
      - output_tokens
      additionalProperties: false
    ConversationSummary:
      type: object
      properties:
        id: *id001
        title: *id002
        updated_at: &id008
          type: string
          format: date-time
      required:
      - id
      - title
      - updated_at
      additionalProperties: false
    Message:
      type: object
      properties:
        id: *id001
        role:
          enum:
          - user
          - assistant
        content: *id002
        tier:
          type:
          - integer
          - 'null'
          minimum: 1
        model_entry_id:
          type:
          - string
          - 'null'
          format: uuid
        model_title: *id007
        input_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
        output_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
        note: *id007
        outcome:
          enum:
          - completed
          - failed
          - tool_requested
        created_at: *id008
        thinking:
          type:
          - string
          - 'null'
          description: Concatenated assistant thinking, separate from answer content. Null when absent
            or for older messages. Never logged or sent back to a model. At most the first 100000 characters
            per message are stored; later thinking continues streaming.
          maxLength: 100000
      required:
      - id
      - role
      - content
      - tier
      - model_entry_id
      - model_title
      - input_tokens
      - output_tokens
      - note
      - outcome
      - created_at
      - thinking
      additionalProperties: false
    Job:
      type: object
      properties:
        job_id: *id006
        skill:
          type: string
        title:
          type: string
        label:
          type: string
          maxLength: 80
        status:
          enum:
          - awaiting_approval
          - queued
          - completed
          - failed
          - rejected
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        output:
          anyOf:
          - type: object
            properties:
              file_key:
                type: string
                minLength: 1
              mime:
                type: string
              summary:
                type: string
                minLength: 1
            required:
            - file_key
            - mime
            - summary
            additionalProperties: false
          - type: 'null'
        error:
          anyOf:
          - *id005
          - type: 'null'
      required:
      - job_id
      - skill
      - title
      - label
      - status
      - created_at
      - updated_at
      - output
      - error
      additionalProperties: false
