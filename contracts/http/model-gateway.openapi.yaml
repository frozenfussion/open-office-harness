openapi: 3.1.0
info:
  title: Model Gateway
  version: 1.0.0
paths:
  /health:
    get:
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/call:
    post:
      operationId: post_v1_call
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                  tool_calls:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        arguments:
                          type: object
                          additionalProperties: true
                      required:
                      - id
                      - name
                      - arguments
                      additionalProperties: false
                  model_entry_id:
                    type: string
                    format: uuid
                  model_title:
                    type: string
                  tier:
                    type:
                    - integer
                    - 'null'
                    minimum: 1
                  usage:
                    type: object
                    properties:
                      input_tokens:
                        type: integer
                        minimum: 0
                      output_tokens:
                        type: integer
                        minimum: 0
                    required:
                    - input_tokens
                    - output_tokens
                    additionalProperties: false
                  cost_usd:
                    type: number
                    minimum: 0
                  thinking_applied:
                    type: boolean
                    description: Whether the caller thinking choice was honoured.
                      True when thinking is true or absent; when false, true only
                      if the answering entry has a request_settings_thinking_off object.
                  thinking:
                    type:
                    - string
                    - 'null'
                    minLength: 1
                    description: Concatenated visible thinking text, separate from
                      content; null when no non-empty thinking was returned.
                  reasoning_state:
                    type:
                    - object
                    - 'null'
                    description: Opaque provider state with model_entry_id. Private
                      to the cluster and the matching provider; never in logs, Kafka
                      or browser responses. The Harness stores it privately for replay
                      across turns.
                    additionalProperties: true
                  tool_choice_applied:
                    type: boolean
                required:
                - content
                - tool_calls
                - model_entry_id
                - model_title
                - tier
                - usage
                - cost_usd
                - thinking_applied
                - thinking
                - reasoning_state
                - tool_choice_applied
                additionalProperties: false
            text/event-stream:
              schema:
                oneOf:
                - type: object
                  properties:
                    type:
                      const: delta
                    text:
                      type: string
                  required:
                  - type
                  - text
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: tool_call
                    id:
                      type: string
                    name:
                      type: string
                    arguments:
                      type: object
                      additionalProperties: true
                  required:
                  - type
                  - id
                  - name
                  - arguments
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: completed
                    model_entry_id:
                      type: string
                      format: uuid
                    model_title:
                      type: string
                    tier:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                    usage:
                      type: object
                      properties:
                        input_tokens:
                          type: integer
                          minimum: 0
                        output_tokens:
                          type: integer
                          minimum: 0
                      required:
                      - input_tokens
                      - output_tokens
                      additionalProperties: false
                    cost_usd:
                      type: number
                      minimum: 0
                    thinking_applied:
                      type: boolean
                      description: Whether the caller thinking choice was honoured.
                        True when thinking is true or absent; when false, true only
                        if the answering entry has a request_settings_thinking_off
                        object.
                    reasoning_state:
                      type:
                      - object
                      - 'null'
                      description: Opaque provider state with model_entry_id. Private
                        to the cluster and the matching provider; never in logs, Kafka
                        or browser responses. The Harness stores it privately for
                        replay across turns.
                      additionalProperties: true
                    tool_choice_applied:
                      type: boolean
                  required:
                  - type
                  - model_entry_id
                  - model_title
                  - tier
                  - usage
                  - cost_usd
                  - thinking_applied
                  - reasoning_state
                  - tool_choice_applied
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: failed
                    error:
                      $ref: '#/components/schemas/Error'
                  required:
                  - type
                  - error
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: thinking
                    text:
                      type: string
                      minLength: 1
                  required:
                  - type
                  - text
                  additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: budget_exceeded, unavailable or registry_unavailable. PinnedError
            is returned only to the authorized Control Centre test call; Harness responses
            remain Error.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/PinnedError'
        '404':
          description: 'no_model: no active supported matching entry'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: no entry called and at least one skipped for
            rate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  minLength: 1
                tier:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                user_id:
                  type: string
                  minLength: 1
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      role:
                        enum:
                        - system
                        - user
                        - assistant
                        - tool
                      content:
                        type:
                        - string
                        - 'null'
                      reasoning_state:
                        type:
                        - object
                        - 'null'
                        description: Opaque provider state with model_entry_id. Private
                          to the cluster and the matching provider; never in logs,
                          Kafka or browser responses. The Harness stores it privately
                          for replay across turns.
                        additionalProperties: true
                      tool_call_id:
                        type:
                        - string
                        - 'null'
                        minLength: 1
                      tool_calls:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            arguments:
                              type: object
                              additionalProperties: true
                          required:
                          - id
                          - name
                          - arguments
                          additionalProperties: false
                    required:
                    - role
                    additionalProperties: false
                    anyOf:
                    - required:
                      - content
                      properties:
                        content:
                          type: string
                    - required:
                      - tool_calls
                      properties:
                        tool_calls:
                          type: array
                          minItems: 1
                    allOf:
                    - if:
                        properties:
                          role:
                            const: tool
                      then:
                        required:
                        - tool_call_id
                        - content
                        properties:
                          tool_call_id:
                            type: string
                            minLength: 1
                          content:
                            type: string
                      else:
                        properties:
                          tool_call_id:
                            type: 'null'
                    - if:
                        properties:
                          role:
                            not:
                              const: assistant
                      then:
                        properties:
                          reasoning_state:
                            type: 'null'
                          tool_calls:
                            type: array
                            maxItems: 0
                tools:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                      description:
                        type: string
                      input_schema:
                        type: object
                        additionalProperties: true
                    required:
                    - name
                    - description
                    - input_schema
                    additionalProperties: false
                stream:
                  type: boolean
                model_entry_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                thinking:
                  type: boolean
                  default: true
                  description: Defaults to true. When false, the answering entry request_settings_thinking_off
                    object is merged after request_settings using top-level replacement
                    and null removal. Ignored when the entry has no off-settings object.
                    The Control Centre test caller must omit this field.
                tool_choice:
                  oneOf:
                  - const: none
                  - type: 'null'
                  - type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                    required:
                    - name
                    additionalProperties: false
              required:
              - purpose
              - user_id
              - messages
              - stream
              additionalProperties: false
              allOf:
              - if:
                  properties:
                    purpose:
                      const: chat
                then:
                  required:
                  - tier
                  properties:
                    tier:
                      type: integer
                      minimum: 1
                else:
                  properties:
                    tier:
                      type: 'null'
      description: 'Audience ooh-model-gateway. Callers: Harness (any purpose); Slides
        worker (non-pinned, non-streamed); Control Centre (the existing pinned non-streamed
        connection test only). Others receive 403. Main entries precede backups, then
        priority and created_at. model_entry_id pins an entry with no failover. Follow-ups
        inside a tool turn stay pinned. Every completed answer includes reasoning_state
        with its model_entry_id, also when no tool was called. Each history message
        state is replayed only for its matching entry; foreign states are dropped
        without error. Chat Completions replays reasoning_content and function tool
        calls; Messages replays complete ordered content blocks with thinking signatures
        and redacted thinking; Responses requests reasoning.encrypted_content with
        store:false and replays output items before function_call_output. Forced tools
        use auto unless thinking is exactly disabled, with tool_choice_applied:false;
        none disables tools. Provider details are scrubbed and returned only for Control
        Centre tests. Visible thinking remains separate from answer text. Opaque reasoning
        is never logged or published on Kafka. Audit events contain only IDs, model
        title, usage, cost and classification scores. Health changes and audit publishes run after the answer in retained background
        tasks with two-second limits. A forced-tool HTTP 400 before output retries once
        on the same entry with auto, without a health report for the initial 400.'
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Caller correlation UUID; generated when omitted.
  /v1/classify:
    post:
      operationId: post_v1_classify
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  scores:
                    type: object
                    minProperties: 1
                    additionalProperties:
                      type: number
                      minimum: 0
                      maximum: 1
                  model_entry_id:
                    type: string
                    format: uuid
                  model_title:
                    type: string
                  usage:
                    type: object
                    properties:
                      input_tokens:
                        type: integer
                        minimum: 0
                      output_tokens:
                        type: integer
                        minimum: 0
                    required:
                    - input_tokens
                    - output_tokens
                    additionalProperties: false
                  cost_usd:
                    type: number
                    minimum: 0
                required:
                - scores
                - model_entry_id
                - model_title
                - usage
                - cost_usd
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: unavailable, budget_exceeded or registry_unavailable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/PinnedError'
        '404':
          description: 'no_model: no active classification entry'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: no available entry under its rate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 20000
                questions:
                  type: object
                  minProperties: 1
                  maxProperties: 10
                  propertyNames:
                    pattern: ^[a-z][a-z0-9_]{0,39}$
                  additionalProperties:
                    type: string
                    minLength: 1
                user_id:
                  type: string
                  minLength: 1
                model_entry_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
              required:
              - text
              - questions
              - user_id
              additionalProperties: false
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Caller correlation UUID; generated when omitted.
      description: Audience ooh-model-gateway. Harness and safety watcher may classify.
        Control Centre may only test a pinned classification entry with user_id starting
        admin-test-, text This is a connection test. and questions {"test":"Is this a connection
        test?"}. Active classification entries have no tier, use main before backup,
        and obey the same rates, budgets and cost rules as calls. jev_systemone uses
        state and typed noul questions. Chat adapters request a JSON object of scores.
        Missing, nonnumeric or out-of-range scores fail the entry; extra keys are
        ignored. Audit contains scores and usage, never text.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
      additionalProperties: false
    PinnedError:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        provider_status:
          type:
          - integer
          - 'null'
        provider_message:
          type:
          - string
          - 'null'
          maxLength: 300
      required:
      - code
      - message
      - provider_status
      - provider_message
      additionalProperties: false
