openapi: 3.1.0
info:
  title: Model Gateway
  version: 1.0.0
paths:
  /health:
    get:
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/call:
    post:
      operationId: post_v1_call
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                  tool_calls:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        arguments:
                          type: object
                          additionalProperties: true
                      required:
                      - id
                      - name
                      - arguments
                      additionalProperties: false
                  model_entry_id:
                    type: string
                    format: uuid
                  model_title:
                    type: string
                  tier:
                    type:
                    - integer
                    - 'null'
                    minimum: 1
                  usage:
                    type: object
                    properties:
                      input_tokens:
                        type: integer
                        minimum: 0
                      output_tokens:
                        type: integer
                        minimum: 0
                    required:
                    - input_tokens
                    - output_tokens
                    additionalProperties: false
                  cost_usd:
                    type: number
                    minimum: 0
                required:
                - content
                - tool_calls
                - model_entry_id
                - model_title
                - tier
                - usage
                - cost_usd
                additionalProperties: false
            text/event-stream:
              schema:
                oneOf:
                - type: object
                  properties:
                    type:
                      const: delta
                    text:
                      type: string
                  required:
                  - type
                  - text
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: tool_call
                    id:
                      type: string
                    name:
                      type: string
                    arguments:
                      type: object
                      additionalProperties: true
                  required:
                  - type
                  - id
                  - name
                  - arguments
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: completed
                    model_entry_id:
                      type: string
                      format: uuid
                    model_title:
                      type: string
                    tier:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                    usage:
                      type: object
                      properties:
                        input_tokens:
                          type: integer
                          minimum: 0
                        output_tokens:
                          type: integer
                          minimum: 0
                      required:
                      - input_tokens
                      - output_tokens
                      additionalProperties: false
                    cost_usd:
                      type: number
                      minimum: 0
                  required:
                  - type
                  - model_entry_id
                  - model_title
                  - tier
                  - usage
                  - cost_usd
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      const: failed
                    error:
                      $ref: '#/components/schemas/Error'
                  required:
                  - type
                  - error
                  additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: budget_exceeded, unavailable or registry_unavailable. PinnedError
            is returned only to the authorized Control Centre test call; Harness responses
            remain Error.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/PinnedError'
        '404':
          description: 'no_model: no active supported matching entry'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: no entry called and at least one skipped for
            rate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  minLength: 1
                tier:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                user_id:
                  type: string
                  minLength: 1
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      role:
                        enum:
                        - system
                        - user
                        - assistant
                      content:
                        type: string
                    required:
                    - role
                    - content
                    additionalProperties: false
                tools:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                      description:
                        type: string
                      input_schema:
                        type: object
                        additionalProperties: true
                    required:
                    - name
                    - description
                    - input_schema
                    additionalProperties: false
                stream:
                  type: boolean
                model_entry_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
              required:
              - purpose
              - user_id
              - messages
              - stream
              additionalProperties: false
              allOf:
              - if:
                  properties:
                    purpose:
                      const: chat
                then:
                  required:
                  - tier
                  properties:
                    tier:
                      type: integer
                      minimum: 1
                else:
                  properties:
                    tier:
                      type: 'null'
      description: 'Audience ooh-model-gateway. The Harness service account may make
        purpose calls. The Control Centre service account may only make a pinned non-streamed
        test: messages exactly [{"role":"user","content":"Reply with the single word
        OK."}], no tools, user_id starting admin-test-. Every other caller or Control
        Centre request is forbidden. Active entries: main before backup, then priority,
        then created_at. model_entry_id pins one matching entry; rate and budget still
        apply. Before first output failures may fail over; after output, emit failed.
        Registry cache 30 seconds; key cache 60 seconds. Only the Control Centre test
        receives provider_status and scrubbed provider_message on 503. Provider error
        reads are bounded to 4 KiB and messages to 300 characters. Keys, their substrings
        of at least eight characters, and sk- tokens are replaced with [removed].'
  /v1/classify:
    post:
      operationId: post_v1_classify
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                minProperties: 1
                additionalProperties:
                  type: number
                  minimum: 0
                  maximum: 1
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'not_built_yet: Classification arrives in Stage 3'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                questions:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: string
                    minLength: 1
              required:
              - text
              - questions
              additionalProperties: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
      additionalProperties: false
    PinnedError:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        provider_status:
          type:
          - integer
          - 'null'
        provider_message:
          type:
          - string
          - 'null'
          maxLength: 300
      required:
      - code
      - message
      - provider_status
      - provider_message
      additionalProperties: false
