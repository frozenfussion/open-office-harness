openapi: 3.1.0
info:
  title: Model Gateway
  version: 1.0.0
paths:
  /health:
    get:
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
                additionalProperties: false
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/call:
    post:
      operationId: post_v1_call
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                  tokens:
                    type: integer
                    minimum: 0
                required:
                - content
                - tokens
                additionalProperties: false
            text/event-stream:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - delta
                    - completed
                    - failed
                  text:
                    type: string
                  error:
                    $ref: '#/components/schemas/Error'
                required:
                - type
                additionalProperties: false
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  minLength: 1
                tier:
                  type: integer
                  minimum: 1
                user_id:
                  type: string
                  minLength: 1
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                        - system
                        - user
                        - assistant
                        - tool
                      content:
                        type: string
                    required:
                    - role
                    - content
                    additionalProperties: false
                attachments:
                  type: array
                  items:
                    type: string
                    minLength: 1
                stream:
                  type: boolean
              required:
              - purpose
              - user_id
              - messages
              - stream
              additionalProperties: false
  /v1/classify:
    post:
      operationId: post_v1_classify
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                minProperties: 1
                additionalProperties:
                  type: number
                  minimum: 0
                  maximum: 1
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                questions:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: string
                    minLength: 1
              required:
              - text
              - questions
              additionalProperties: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code: &id001
          type: string
          minLength: 1
        message: *id001
      required:
      - code
      - message
      additionalProperties: false
