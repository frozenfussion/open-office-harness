# SPDX-License-Identifier: AGPL-3.0-only
[project]
name = "ooh-harness-api"
version = "0.2.0"
requires-python = "==3.14.10"
dependencies = [
  "fastapi==0.162.2", "uvicorn==0.54.0", "pydantic==2.14.3",
  "httpx==0.28.1", "psycopg[binary]==3.3.8", "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "respx==0.23.1", "ruff==0.17.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
