# SPDX-License-Identifier: AGPL-3.0-only
name: Control Centre image
on:
  push:
    branches: ['**']
    paths:
    - services/control-centre/**
    - .github/workflows/control-centre-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Image tag
      id: tag
      run: echo "value=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: services/control-centre
        file: services/control-centre/Dockerfile
        push: true
        tags: ghcr.io/frozenfussion/ooh-control-centre:${{ steps.tag.outputs.value }}
        labels: org.opencontainers.image.source=https://github.com/frozenfussion/open-office-harness
